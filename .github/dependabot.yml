version: 2
updates:
  # Base images pinned in each images/<name>/Dockerfile.
  - package-ecosystem: docker
    directories:
      - "/images/*"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # Action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
