name: Build images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 0'   # Sundays 04:00 UTC: pick up upstream base-image updates
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build, space-separated (empty = all)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Work out which images to build. Schedule/dispatch build everything (or
  # the dispatch selection); pushes and PRs build only the image directories
  # they touch. Changes outside images/ (this workflow, images.json) build all.
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ inputs.images }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=$(jq -r '[.[].name] | unique | join(" ")' images.json)

          case "$EVENT" in
            schedule) names="$all" ;;
            workflow_dispatch) names="${SELECTED:-$all}" ;;
            *)
              base="${PR_BASE:-$PUSH_BEFORE}"
              if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                names="$all"            # new branch or unknown base: build everything
              else
                changed=$(git diff --name-only "$base" HEAD)
                if echo "$changed" | grep -qvE '^images/|^$|\.md$'; then
                  names="$all"          # shared CI config changed
                else
                  names=$(echo "$changed" | grep -E '^images/[^/]+/' | grep -vE '\.md$' | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)
                fi
              fi
              ;;
          esac

          matrix=$(jq -c --arg names "$names" \
            '($names | split(" ") | map(select(. != ""))) as $n | map(select(.name as $x | $n | index($x)))' images.json)
          echo "Building: $(echo "$matrix" | jq -r 'map(.name + ":" + .tag) | join(", ")')"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$matrix" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false      # one broken upstream image shouldn't block the rest
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: ${{ matrix.name }}:${{ matrix.tag }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      CONTEXT: images/${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Moving tag (latest / cpu / intel / ...) plus a dated one, so a bad
      # weekly rebuild can be rolled back by pinning e.g. :2026-11-22.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag == 'latest' && '' || format('{0}-', matrix.tag) }}{{date 'YYYY-MM-DD'}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: local/test:${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.tag }}

      - name: Smoke test
        run: |
          if [ -x "$CONTEXT/smoke-test.sh" ]; then
            "$CONTEXT/smoke-test.sh" "local/test:${{ github.run_id }}"
          else
            echo "No smoke-test.sh for ${{ matrix.name }}; the build itself is the check."
          fi

      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.tag }}

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling the workflow from inside the scheduled
  # run keeps it alive without dummy commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
