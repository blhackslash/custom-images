name: Weekly Synapse Admin Build

on:
  schedule:
    - cron: '0 3 * * 0' # Runs automatically every Sunday at 3:00 AM UTC
  workflow_dispatch: # Gives you a "Run Workflow" button in the UI for manual updates

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write # Allows the action to push to your GitHub Container Registry
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GitHub Username (Docker requires lowercase tags)
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Create Custom Dockerfile on the fly
        run: |
          cat << 'EOF' > Dockerfile
          FROM awesometechnologies/synapse-admin:latest
          # Bake the custom port into the Nginx config permanently
          RUN sed -i 's/listen[[:space:]]*80;/listen 8081;/g' /etc/nginx/conf.d/default.conf
          EXPOSE 8081
          EOF

      - name: Build and Push Custom Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/synapse-admin-custom:latest
